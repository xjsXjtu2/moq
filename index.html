<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>WebTransport 测试页</title>
<style>body{font-family:-apple-system,sans-serif;max-width:760px;margin:40px auto;padding:0 16px}
button{padding:8px 14px;margin:4px 6px 4px 0;font-size:14px}
#log{background:#111;color:#0f0;padding:12px;height:360px;overflow:auto;font:12px/1.5 Menlo,monospace;white-space:pre-wrap;border-radius:6px}</style></head><body>
<h2>WebTransport 自动计数 echo 测试</h2>
<p>URL: <code id="url"></code>；建联后自动发 1、2、3…，服务端回 s1、s2、s3…</p>
<button onclick="connect()">Connect (开始自动计数)</button>
<button onclick="disconnect()">断开</button>
<button onclick="document.getElementById('log').textContent=''">清空日志</button>
<label style="margin-left:12px"><input type="radio" name="mode" value="datagram" checked> Datagram</label>
<label><input type="radio" name="mode" value="stream"> 双向流</label>
<div id="log"></div>
<script>
const URL = location.origin + "/wt";
document.getElementById("url").textContent = URL;
let wt = null, timer = null, counter = 0;
const dec = new TextDecoder(), enc = new TextEncoder();
function log(m){const l=document.getElementById("log");
  l.textContent+=("["+new Date().toLocaleTimeString()+"] "+m)+"\n";l.scrollTop=l.scrollHeight;}
function mode(){return document.querySelector('input[name=mode]:checked').value;}

async function connect(){
  if(wt){log("已连接，先断开");return;}
  counter = 0;
  try{
    log("[connect] 正在连接 "+URL);
    wt = new WebTransport(URL);
    await wt.ready;
    log("[connect] 会话已建立，开始自动计数");
    // 持续收 datagram
    (async()=>{
      const r = wt.datagrams.readable.getReader();
      for(;;){const {value,done}=await r.read(); if(done)break;
        log("[datagram<-] "+dec.decode(value));}
    })().catch(()=>{});
    wt.closed.then(()=>{stopTimer();log("[closed] 会话关闭");wt=null;})
             .catch(e=>{stopTimer();log("[closed] "+e);wt=null;});
    // 建联成功立即发 "1"，然后每秒递增
    tick();
    timer = setInterval(tick, 1000);
  }catch(e){log("[connect] 失败: "+e);wt=null;}
}
function stopTimer(){ if(timer){clearInterval(timer);timer=null;} }

async function tick(){
  if(!wt) return;
  counter += 1;
  const payload = "test" + counter;
  try{
    if(mode()==="datagram"){
      const w = wt.datagrams.writable.getWriter();
      await w.write(enc.encode(payload)); w.releaseLock();
      log("[datagram->] "+payload);
    }else{
      const s = await wt.createBidirectionalStream();
      const w = s.writable.getWriter();
      await w.write(enc.encode(payload)); await w.close();
      log("[stream-> ] "+payload);
      const rd = s.readable.getReader(); let buf="";
      for(;;){const {value,done}=await rd.read(); if(done)break; buf+=dec.decode(value);}
      log("[stream<- ] "+buf);
    }
  }catch(e){log("[send] 失败: "+e);}
}
function disconnect(){ stopTimer(); if(wt){wt.close();wt=null;log("[disconnect] 已主动断开");} }
if(new URLSearchParams(location.search).get("auto")==="1"){
  window.addEventListener("load", ()=>{ log("[auto] 页面自动连接"); connect(); });
}
</script></body></html>
