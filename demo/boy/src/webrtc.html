<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MoQ Boy — WebRTC</title>
        <link rel="icon" href="data:," />
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: system-ui, sans-serif;
                color-scheme: dark;
                background: #0a0a0a;
                color: #e0e0e0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            header {
                border-bottom: 1px solid #333;
                padding: 0.75rem 1.5rem;
                width: 100%;
                display: flex;
                align-items: center;
                gap: 1rem;
            }
            header h1 { font-size: 1.1rem; font-weight: 600; color: #8bac0f; }
            header .mode-badge {
                background: #8bac0f22;
                color: #8bac0f;
                font-size: 0.7rem;
                padding: 0.15rem 0.5rem;
                border-radius: 3px;
                font-family: monospace;
            }

            .video-container {
                margin-top: 1rem;
                border: 1px solid #333;
                border-radius: 4px;
                overflow: hidden;
                image-rendering: pixelated;
            }
            .video-container video {
                display: block;
                /* Game Boy native aspect ratio: 160x144 = 10:9 */
                width: min(640px, 90vw);
                aspect-ratio: 10 / 9;
                object-fit: contain;
                background: #111;
            }

            .controls {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 0.5rem;
                margin-top: 1rem;
                padding: 1rem;
                max-width: 400px;
                width: 100%;
            }
            .controls button {
                font-family: system-ui, sans-serif;
                font-size: 0.9rem;
                padding: 0.75rem 0.5rem;
                border: 1px solid #444;
                border-radius: 4px;
                background: #1a1a1a;
                color: #ccc;
                cursor: pointer;
                user-select: none;
                touch-action: manipulation;
            }
            .controls button:active {
                background: #8bac0f44;
                border-color: #8bac0f;
            }

            .dpad-up    { grid-column: 2; }
            .dpad-left  { grid-column: 1; grid-row: 2; }
            .dpad-right { grid-column: 3; grid-row: 2; }
            .dpad-down  { grid-column: 2; grid-row: 3; }

            .action-row {
                display: flex;
                gap: 0.5rem;
                margin-top: 0.5rem;
                max-width: 400px;
                width: 100%;
                justify-content: center;
            }
            .action-row button {
                font-family: system-ui, sans-serif;
                font-size: 0.85rem;
                padding: 0.5rem 1.5rem;
                border: 1px solid #444;
                border-radius: 4px;
                background: #1a1a1a;
                color: #ccc;
                cursor: pointer;
            }
            .action-row button:active {
                background: #8bac0f44;
                border-color: #8bac0f;
            }

            .status {
                margin-top: 0.75rem;
                font-size: 0.7rem;
                color: #555;
                font-family: monospace;
            }

            .error {
                color: #e74c3c;
                font-size: 0.8rem;
                margin-top: 0.5rem;
            }

            footer {
                margin-top: auto;
                padding: 0.75rem 1.5rem;
                border-top: 1px solid #333;
                width: 100%;
                font-family: monospace;
                font-size: 0.7rem;
                color: #555;
                text-align: center;
            }
            footer a { color: #8bac0f; text-decoration: none; }
        </style>
    </head>
    <body>
        <header>
            <h1>MoQ Boy</h1>
            <span class="mode-badge">WEBRTC</span>
        </header>

        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
        </div>

        <div class="status" id="status">Connecting...</div>
        <div class="error" id="error" hidden></div>

        <div class="controls" id="controls" style="display:none">
            <button class="dpad-up" data-btn="up">▲</button>
            <button class="dpad-left" data-btn="left">◀</button>
            <button class="dpad-right" data-btn="right">▶</button>
            <button class="dpad-down" data-btn="down">▼</button>
            <button data-btn="a">A</button>
            <button data-btn="b">B</button>
            <button data-btn="start">Start</button>
            <button data-btn="select">Select</button>
        </div>

        <div class="action-row" id="action-row" style="display:none">
            <button id="btn-reset">Reset</button>
            <button id="btn-unmute">🔇 Unmute</button>
        </div>

        <footer>
            try: <code>cargo run -p moq-boy --features webrtc -- --rom &lt;rom&gt; --webrtc-listen 0.0.0.0:8080</code>
            &nbsp;|&nbsp; <a href="/">MoQ mode</a>
        </footer>

        <script type="module" src="./webrtc.ts"></script>
    </body>
</html>
